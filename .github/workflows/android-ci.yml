name: Android CI
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # setup-java v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify hosted Android SDK
        run: python3 tools/run_android_checks.py sdk
      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # gradle/actions v6.4.0; wrapper validation
      - name: Validate feature inventory and source policies
        run: python3 tools/validate_feature_matrix.py && python3 tools/check_source_policy.py
      - name: Verify wrapper provenance
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Unit tests, lint, and debug APK
        run: python3 tools/run_android_checks.py build
      - name: Regenerate official Gradle wrapper
        run: ./gradlew --no-daemon wrapper --gradle-version 8.11.1 --distribution-type bin --gradle-distribution-sha256-sum f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # upload-artifact v7.0.2
        with:
          name: dex-wallpaper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # upload-artifact v7.0.2
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/schemas/
            gradle/wrapper/
            gradlew
            gradlew.bat
