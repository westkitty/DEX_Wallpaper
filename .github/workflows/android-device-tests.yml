name: Android device tests
on:
  push:
    branches: [main, 'arena/**']
    paths: ['.github/workflows/android-device-tests.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Android CI']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: device-tests-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false
jobs:
  emulator:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
      - name: Choose available emulator acceleration without privileged changes
        run: |
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo 'DEX_ACCEL=-accel on' >> "$GITHUB_ENV"
            echo '::notice title=Emulator acceleration::Existing KVM access available; no privileged setup.'
          else
            echo 'DEX_ACCEL=-accel off' >> "$GITHUB_ENV"
            echo '::notice title=Emulator acceleration::KVM unavailable without privileges; using software emulation.'
          fi
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # verified v2 revision
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: ${{ env.DEX_ACCEL }} -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python3 tools/run_android_instrumentation.py
      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/device-evidence/
